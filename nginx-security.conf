# ============================================================
# PH BRANDZ — NGINX SECURITY SNIPPET (OWASP RECOMMENDED)
# Incluir dentro do bloco server { ... }
# ============================================================

# 1. Cabeçalhos de Segurança HTTP
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=(), display-capture=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; media-src 'self' data: https:; frame-src https://www.youtube-nocookie.com; frame-ancestors 'none'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://forms.gle; upgrade-insecure-requests;" always;

# 2. Bloqueio de arquivos ocultos e de rascunho
location ~ /\.(?!well-known) {
    deny all;
    return 404;
}

location ~* (\.before-rework|\.bak|\.backup|\.old|scratch) {
    deny all;
    return 404;
}

# 3. Ocultar versão do servidor Nginx
server_tokens off;
